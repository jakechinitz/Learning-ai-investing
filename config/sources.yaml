# Educational frameworks to apply
learning_frameworks:
  valuation:
    - "P/E vs growth rate (PEG ratio)"
    - "EV/Revenue for growth companies"
    - "Free cash flow yield"
    - "Rule of 40 for SaaS"

  competitive_moats:
    - "Network effects"
    - "Switching costs"
    - "Economies of scale"
    - "Intangible assets (brand, IP)"
    - "Cost advantages"

  ai_specific:
    - "Data moats - proprietary training data"
    - "Compute access and cost"
    - "Distribution advantages"
    - "Model capabilities vs commoditization"
    - "Inference cost economics"

  questions_to_ask:
    - "What is the company's right to win in AI?"
    - "Is this a pick-and-shovel play or direct AI bet?"
    - "How defensible is the AI advantage?"
    - "What's priced in at current valuation?"
    - "What could go wrong? (steelman the bear case)"
